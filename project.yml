name: Larpnet
options:
  bundleIdPrefix: pl.larpnet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0

schemes:
  Larpnet:
    build:
      targets:
        Larpnet: all
        LarpnetTests: [test]
        LarpnetUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LarpnetTests
        - LarpnetUITests
    archive:
      config: Release

targets:
  Larpnet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Larpnet
    dependencies:
      - package: SwiftSoup
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        BGTaskSchedulerPermittedIdentifiers:
          - pl.larpnet.ios.refresh
        UIBackgroundModes:
          - fetch
        UIAppFonts:
          - OpenSans-Regular.ttf
          - OpenSans-Semibold.ttf
          - OpenSans-Bold.ttf
          - OpenSans-Italic.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.larpnet.ios
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  LarpnetTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LarpnetTests
    dependencies:
      - target: Larpnet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: pl.larpnet.ios.tests
        SWIFT_VERSION: "6.0"

  LarpnetUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LarpnetUITests
    dependencies:
      - target: Larpnet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: pl.larpnet.ios.uitests
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Larpnet
