name: Larpnet
options:
  bundleIdPrefix: pl.larpnet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ZR99PJ76A8

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0

schemes:
  Larpnet:
    build:
      targets:
        Larpnet: all
        LarpnetTests: [test]
        LarpnetUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LarpnetTests
        - LarpnetUITests
    archive:
      config: Release

targets:
  Larpnet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Larpnet
      - path: Settings.bundle
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
    info:
      path: Generated/Info.plist
      properties:
        # XcodeGen bakes a literal CFBundleShortVersionString/CFBundleVersion default (1.0 / 1)
        # into the generated Info.plist template when these keys aren't listed here explicitly
        # -- confirmed live: MARKETING_VERSION/CURRENT_PROJECT_VERSION above had no effect on a
        # freshly-regenerated Generated/Info.plist until these were added. Referencing the build
        # settings as variables (not resolving them here) makes Xcode substitute the real value
        # at build time, for both local and Xcode Cloud archive builds.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        BGTaskSchedulerPermittedIdentifiers:
          - pl.larpnet.ios.refresh
        UIBackgroundModes:
          - fetch
        UIAppFonts:
          - OpenSans-Regular.ttf
          - OpenSans-Semibold.ttf
          - OpenSans-Bold.ttf
          - OpenSans-Italic.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.larpnet.ios
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  LarpnetTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LarpnetTests
    dependencies:
      - target: Larpnet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: pl.larpnet.ios.tests
        SWIFT_VERSION: "6.0"

  LarpnetUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LarpnetUITests
    dependencies:
      - target: Larpnet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: pl.larpnet.ios.uitests
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Larpnet
